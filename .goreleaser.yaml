# GoReleaser config for Xynolog's xynolog CLI.
#
# Channels, deliberately minimal: GitHub Release archives (darwin/linux/
# windows × arm64/amd64, static), Linux packages, checksums, and SBOMs.
# Windows gets a zip holding xynolog.exe; under WSL2 it runs the Linux build.
version: 2

project_name: xynolog

builds:
  - id: xynolog
    binary: xynolog
    main: ./cmd/xynolog
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/xynolog/cli/internal/launcher.BuildVersion={{.Version}}
      - -X github.com/xynolog/cli/internal/launcher.BuildCommit={{.ShortCommit}}
      - -X github.com/xynolog/cli/internal/launcher.BuildDate={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "xynolog_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

nfpms:
  - id: linux-packages
    package_name: xynolog
    vendor: Xynolog
    homepage: https://github.com/xynolog/cli
    maintainer: Xynolog
    description: "Host CLI for managing local Xynolog stacks"
    license: Apache-2.0
    formats: [deb, rpm]
    dependencies: [git]
    builds: [xynolog]
