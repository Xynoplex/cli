name: Release

# Application tagging (versioning R14, R17): a person pushes a signed tag
# vYY.M.N, and this checks the release it names. The tag must be the release
# signer's, on a commit main holds; upstream.lock.json must name each upstream
# by its release; and GoReleaser must build every archive and package from it.
# It publishes nothing. Once it passes, a person dispatches publish.yml at the
# tag, which releases them:
#
#   gh workflow run publish.yml --ref v26.11.0
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  version:
    name: The tag names a CLI release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-version.sh "$TAG"

  tag:
    needs: version
    permissions:
      contents: read
    uses: xynolog/.github/.github/workflows/release-tag.yml@a70ee7f6c3e7321ef54a071c78504c20e2669110
    with:
      tags: ${{ github.ref_name }}

  sdk:
    needs: [version, tag]
    permissions:
      contents: read
    uses: xynolog/sdk/.github/workflows/upstream.yml@172968e80d9e0cb29e2057acb33246360ebc13ed
    with:
      languages: go
      release: true

  build:
    name: GoReleaser builds every archive and package
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/sdk-go-proxy
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0.24.3
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: release --clean --skip=publish
