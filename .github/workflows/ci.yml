name: CI

# Every push and pull request gets the checks: generated code, vet for each
# release platform, and the build, on one Linux runner. The test suite runs
# on macOS, Linux and Windows nightly, only when main has moved since the
# last full run, or when dispatched by hand.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  nightly-due:
    name: Main moved since the last full run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?status=success&head_sha=$GITHUB_SHA" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")] | length')
          if [ "$full_runs" -eq 0 ]; then echo due=true; else echo due=false; fi >> "$GITHUB_OUTPUT"

  sdk:
    name: SDK bundle from the pinned SDK commit
    needs: nightly-due
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-due.outputs.due == 'true') }}
    runs-on: ubuntu-latest
    env:
      SDK_LANGUAGES: go
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the SDK pin
        id: pin
        run: python3 -c 'import json; print("commit=" + json.load(open("sdk.lock"))["commit"])' >> "$GITHUB_OUTPUT"

      - name: Restore the bundle built from the pin
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/sdk-artifacts
          key: xynoplex-sdk-${{ steps.pin.outputs.commit }}-${{ env.SDK_LANGUAGES }}

      - name: Check out the pinned SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: Xynoplex/sdk
          ref: ${{ steps.pin.outputs.commit }}
          path: .xynoplex-sdk
          submodules: recursive

      - name: Build the bundle
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
        run: |
          built="$(bash .xynoplex-sdk/scripts/resolve-artifact-bundle.sh $SDK_LANGUAGES)"
          cp -a "$built" "$BUNDLE"

      - name: Verify the bundle against the SDK and Protocol pins
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
          SDK_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          languages=()
          for language in $SDK_LANGUAGES; do languages+=(--language "$language"); done
          python3 "$BUNDLE/tools/verify-artifact-bundle.py" "$BUNDLE" \
            --sdk-commit "$SDK_COMMIT" \
            --protocol-commit "$(git ls-tree HEAD protocol | awk '{print $3}')" \
            "${languages[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
          if-no-files-found: error
          include-hidden-files: true

  checks:
    name: Checks
    needs: sdk
    if: ${{ !cancelled() && needs.sdk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Make help lists every public target
        run: python3 scripts/test_make_help.py
      - name: The generated Go matches the spec
        run: |
          for generator in control owner-only stack mcp-tools; do
            node "scripts/generate-$generator.mjs" --check
          done
      - uses: ./.github/actions/sdk-go-proxy
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go generate leaves the tree as committed
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi
      - name: go vet for each release platform
        run: |
          for goos in darwin linux windows; do
            echo "GOOS=$goos"
            GOOS=$goos go vet ./...
          done
      - run: go build ./cmd/xynolog

  test:
    needs: sdk
    if: ${{ !cancelled() && needs.sdk.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    # An explicit budget: the suite drives a fake runtime through real
    # start/stop lifecycles, serially, and runs near Go's undeclared ten-minute
    # default on Linux, past it on macOS, and longest on Windows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            budget: 30m
          - os: ubuntu-latest
            budget: 30m
          - os: windows-latest
            budget: 50m
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/sdk-go-proxy
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -timeout ${{ matrix.budget }} -coverprofile=coverage.out ./...
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test -timeout ${{ matrix.budget }} ./...
      - name: Upload Go coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go-xynolog
          name: go-xynolog
          fail_ci_if_error: false
