name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Make help lists every public target
        if: runner.os == 'Linux'
        run: python3 scripts/test_make_help.py
      - name: Read immutable SDK artifact pin
        id: sdk-pin
        shell: bash
        run: node -e 'const p = JSON.parse(require("node:fs").readFileSync("sdk.lock", "utf8")); for (const [k, v] of Object.entries(p)) console.log(`${k}=${v}`)' >> "$GITHUB_OUTPUT"
      - name: Verify pinned Protocol revision
        env:
          EXPECTED_PROTOCOL: ${{ steps.sdk-pin.outputs.protocol }}
        shell: bash
        run: |
          test "$(git ls-tree HEAD protocol | awk '{print $3}')" = "$EXPECTED_PROTOCOL"
          test "$(git -C protocol rev-parse HEAD)" = "$EXPECTED_PROTOCOL"
      - name: Download verified SDK artifacts
        id: sdk
        uses: Xynoplex/sdk/.github/actions/download-bundle@e15cfe2996b0da2e115cdc2e2e8f9bb1551c208d
        with:
          tag: ${{ steps.sdk-pin.outputs.tag }}
          commit: ${{ steps.sdk-pin.outputs.commit }}
          protocol-commit: ${{ steps.sdk-pin.outputs.protocol }}
          sha256: ${{ steps.sdk-pin.outputs.sha256 }}
          languages: go
      - name: Set the Go file proxy
        env:
          SDK_ARTIFACTS: ${{ steps.sdk.outputs.path }}
        shell: bash
        run: |
          proxy="$(node -e 'const { pathToFileURL } = require("node:url"); const { join } = require("node:path"); process.stdout.write(pathToFileURL(join(process.argv[1], "go", "go-proxy")).href)' "$SDK_ARTIFACTS")"
          echo "GOPROXY=$proxy,https://proxy.golang.org" >> "$GITHUB_ENV"
          echo 'GONOSUMDB=github.com/Xynoplex/sdk/go' >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -coverprofile=coverage.out ./...
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...
      - name: Upload Go coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go-xynaut
          name: go-xynaut
          fail_ci_if_error: false
      - run: go build ./cmd/xynaut
