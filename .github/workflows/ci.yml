name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    name: SDK bundle from the pinned SDK commit
    runs-on: ubuntu-latest
    env:
      SDK_LANGUAGES: go
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the SDK pin
        id: pin
        run: python3 -c 'import json; print("commit=" + json.load(open("sdk.lock"))["commit"])' >> "$GITHUB_OUTPUT"

      - name: Restore the bundle built from the pin
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/sdk-artifacts
          key: xynoplex-sdk-${{ steps.pin.outputs.commit }}-${{ env.SDK_LANGUAGES }}

      - name: Check out the pinned SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: Xynoplex/sdk
          ref: ${{ steps.pin.outputs.commit }}
          path: .xynoplex-sdk
          submodules: recursive

      - name: Build the bundle
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
        run: |
          built="$(bash .xynoplex-sdk/scripts/resolve-artifact-bundle.sh $SDK_LANGUAGES)"
          cp -a "$built" "$BUNDLE"

      - name: Verify the bundle against the SDK and Protocol pins
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
          SDK_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          languages=()
          for language in $SDK_LANGUAGES; do languages+=(--language "$language"); done
          python3 "$BUNDLE/tools/verify-artifact-bundle.py" "$BUNDLE" \
            --sdk-commit "$SDK_COMMIT" \
            --protocol-commit "$(git ls-tree HEAD protocol | awk '{print $3}')" \
            "${languages[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
          if-no-files-found: error
          include-hidden-files: true

  test:
    needs: sdk
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Make help lists every public target
        if: runner.os == 'Linux'
        run: python3 scripts/test_make_help.py
      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
      - name: Set the Go file proxy
        env:
          SDK_ARTIFACTS: ${{ runner.temp }}/sdk-artifacts
        shell: bash
        run: |
          proxy="$(node -e 'const { pathToFileURL } = require("node:url"); const { join } = require("node:path"); process.stdout.write(pathToFileURL(join(process.argv[1], "go", "go-proxy")).href)' "$SDK_ARTIFACTS")"
          echo "GOPROXY=$proxy,https://proxy.golang.org" >> "$GITHUB_ENV"
          echo 'GONOSUMDB=github.com/Xynoplex/sdk/go' >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -coverprofile=coverage.out ./...
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...
      - name: Upload Go coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go-xynaut
          name: go-xynaut
          fail_ci_if_error: false
      - run: go build ./cmd/xynaut
