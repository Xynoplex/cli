version: 2

# One pull request per ecosystem, twice a month at most: every ecosystem's
# updates are one group, proposed on the 1st and the 15th, with no more than
# one PR open. A release waits a week before it is proposed, and a major Go
# release a month (GitHub Actions does not read semver).

updates:
  - package-ecosystem: gomod
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    labels: ["dependencies"]
    directories:
      - /.github/workflows
      - /.github/actions/sdk-go-proxy
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: deps
